name: Compile code
on:
  release:
    types:
      - created
  # Manual re-run for an existing release: GitHub sometimes never delivers the
  # release event to Actions (platform incidents), leaving a published release
  # with no assets. Point this at the tag to build and attach them after the fact.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach assets to (e.g. 2026.08.05)
        required: true
        type: string

# Least privilege by default: every job starts read-only and opts back in to
# what it actually needs.
permissions:
  contents: read

env:
  # Release runs take the tag from the event; manual runs from the input.
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

jobs:
  windows:
    name: Windows MSI
    runs-on: windows-latest
    permissions:
      contents: write  # uploads the MSI as a release asset

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the Tauri CLI
        run: npm ci

      # metadata.json's YYYY.MM.XX[b] isn't semver, and MSI versions cap the major at 255.
      - name: Derive bundle versions
        run: node tools/tauri_version.mjs > version.conf.json

      - name: Build the MSI
        run: npx tauri build --bundles msi --config version.conf.json

      - name: Upload the MSI to the release
        # The tag goes in through the environment, never through ${{ }} expansion
        # into the script body.
        env:
          GH_TOKEN: ${{ secrets.COMPILER || github.token }}
        run: |
          $msi = Get-ChildItem -Path target/release/bundle/msi -Filter *.msi | Select-Object -First 1
          $name = "BetterTroveTools-$env:RELEASE_TAG-win64.msi"
          Move-Item -Path $msi.FullName -Destination ".\$name"
          gh release upload "$env:RELEASE_TAG" "$name" --clobber

  linux:
    name: Linux AppImage and deb
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # uploads the bundles as release assets

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install WebKitGTK and bundling tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install the Tauri CLI
        run: npm ci

      - name: Derive bundle versions
        run: node tools/tauri_version.mjs > version.conf.json

      - name: Build the AppImage and deb
        run: npx tauri build --bundles appimage,deb --config version.conf.json

      - name: Upload the bundles to the release
        env:
          GH_TOKEN: ${{ secrets.COMPILER || github.token }}
        run: |
          appimage=$(ls target/release/bundle/appimage/*.AppImage | head -n1)
          deb=$(ls target/release/bundle/deb/*.deb | head -n1)
          cp "$appimage" "BetterTroveTools-$RELEASE_TAG-linux-x86_64.AppImage"
          cp "$deb" "BetterTroveTools-$RELEASE_TAG-linux-amd64.deb"
          gh release upload "$RELEASE_TAG" "BetterTroveTools-$RELEASE_TAG-linux-x86_64.AppImage" "BetterTroveTools-$RELEASE_TAG-linux-amd64.deb" --clobber
