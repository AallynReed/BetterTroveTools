name: Compile code
on:
  release:
    types:
      - created
  # Manual re-run for an existing release: GitHub sometimes never delivers the
  # release event to Actions (platform incidents), leaving a published release
  # with no assets. Point this at the tag to build and attach them after the fact.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach assets to (e.g. 2026.08.05)
        required: true
        type: string

# Least privilege by default: every job starts read-only and opts back in to
# what it actually needs. Without this, GITHUB_TOKEN inherits whatever the
# repository default is — which may be write-all.
permissions:
  contents: read

env:
  # Release runs take the tag from the event; manual runs from the input.
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Compile Code
    runs-on: windows-latest
    permissions:
      contents: write  # uploads the MSI as a release asset

    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14.3'
          architecture: 'x64'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile code into MSI package
        run: python compile.py bdist_msi
        env:
            PYTHONUTF8: 1

      - name: Move and Rename Files
        # The release name goes in through the environment, not through ${{ }}
        # expansion: expansion pastes it into the script body, where a name
        # containing quotes or a `;` becomes PowerShell that we run.
        env:
          RELEASE_NAME: ${{ env.RELEASE_TAG }}
        run: |
          $env:NEW_FILE_NAME="BetterTroveTools-$env:RELEASE_NAME-win64.msi"
          $msiFile = Get-ChildItem -Path dist -Filter *.msi | Select-Object -First 1
          Write-Host "Found MSI: $($msiFile.FullName)"
          Move-Item -Path $msiFile.FullName -Destination ".\$env:NEW_FILE_NAME"

      # Uploaded by tag rather than the event's upload_url, so a manual run can
      # attach to a release that was published earlier. --clobber replaces an
      # asset left behind by a half-finished run.
      - name: Upload file to release
        env:
          GH_TOKEN: ${{ secrets.COMPILER || github.token }}
        run: gh release upload "$env:RELEASE_TAG" "BetterTroveTools-$env:RELEASE_TAG-win64.msi" --clobber

  linux-package:
    name: Package Linux source
    runs-on: ubuntu-latest
    permissions:
      contents: write  # uploads the source tarball as a release asset

    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Build Linux source tarball
        env:
          RELEASE_NAME: ${{ env.RELEASE_TAG }}
        run: |
          OUT="BetterTroveTools-$RELEASE_NAME-linux.tar.gz"
          # git archive emits only committed files (no venvs/build/dist/__pycache__)
          # and honours `export-ignore` attributes, so it's a clean run-from-source bundle.
          git archive --format=tar.gz --prefix=BetterTroveTools/ -o "$OUT" HEAD
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload tarball to release
        env:
          GH_TOKEN: ${{ secrets.COMPILER || github.token }}
        run: gh release upload "$RELEASE_TAG" "$OUT" --clobber