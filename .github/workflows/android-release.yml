name: Release Android APK

# Builds the Android APK when a GitHub Release is published and attaches it to
# that release, so every release ships a downloadable, reproducible APK built on
# GitHub's infrastructure. Can also be run manually (uploads an artifact only).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # needed to upload the APK as a release asset

jobs:
  build-apk:
    name: Build & attach release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # Mirror the app version (root metadata.json) into the web build so the
      # offline sidebar shows the real version instead of a placeholder.
      - name: Sync app version into the web build
        run: cp metadata.json web/metadata.json

      # cap sync copies the web/ build into the native project and regenerates
      # the Capacitor plugin glue (both are git-ignored / not committed).
      - name: Sync web build into the Android project
        run: npx cap sync android

      # The debug APK is signed with the auto-generated debug keystore, so it is
      # installable when sideloaded (an unsigned release APK would not install).
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK with the app version
        id: name
        run: |
          VER=$(node -p "require('./metadata.json').APP_VERSION")
          TAG="${{ github.event.release.tag_name }}"
          SUFFIX="${TAG:-$VER}"
          OUT="BetterTroveTools-${SUFFIX}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterTroveTools-release-apk
          path: ${{ steps.name.outputs.apk }}
          if-no-files-found: error

      - name: Attach APK to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.name.outputs.apk }}
