name: Release Android APK & AAB

# Builds both the Android APK (sideload / GitHub Release asset) and the Android
# App Bundle (Play Store upload format) when a GitHub Release is published. APK
# is attached to the release for end users; AAB stays as a workflow artifact for
# the maintainer to grab and upload to Play Console. Both come from the same
# Gradle invocation and the same keystore decode, so they share a signing
# identity and CI minutes don't double.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # needed to upload the APK as a release asset

jobs:
  build-apk:
    name: Build & attach release APK + AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # Mirror the app version (root metadata.json) into the web build so the
      # offline sidebar shows the real version instead of a placeholder.
      - name: Sync app version into the web build
        run: cp metadata.json web/metadata.json

      # cap sync copies the web/ build into the native project and regenerates
      # the Capacitor plugin glue (both are git-ignored / not committed).
      - name: Sync web build into the Android project
        run: npx cap sync android

      # Decode the release keystore from the GitHub Actions secret into a real
      # file the Gradle signing config can read. The same keystore identity is
      # used by every CI build (and the maintainer's local builds), so users
      # never hit INSTALL_FAILED_UPDATE_INCOMPATIBLE between consecutive releases.
      #
      # `tr -d '\r\n '` strips any stray whitespace that may have snuck into the
      # secret on upload (e.g. CR characters when `gh secret set` was piped from
      # a Windows shell). `keytool -list` verifies the decoded file is actually
      # a usable keystore before we hand it to Gradle, so a bad secret fails
      # here with a clear message instead of mid-signing with a cryptic one.
      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing — release builds cannot be signed."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          KEYSTORE_FILE="$RUNNER_TEMP/signing/btt-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$KEYSTORE_FILE"
          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Decoded keystore is empty — check ANDROID_KEYSTORE_BASE64 secret content."
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass "$ANDROID_KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::Decoded keystore did not open with ANDROID_KEYSTORE_PASSWORD. Re-upload the secrets (most likely cause: stray whitespace introduced when piping to 'gh secret set' from a Windows shell — pipe from a file via stdin instead)."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      # Release APK + AAB signed with the stable BTT keystore (env vars below
      # feed the signingConfigs.release block in android/app/build.gradle).
      # Both targets build in a single Gradle invocation so the keystore is
      # loaded once and CI minutes don't double. Same signing identity for
      # both, so Play-distributed (re-signed by Google if enrolled with their
      # key, or signed by us if uploaded as the app signing key) and GitHub-
      # distributed installs land on the same package.
      - name: Build release APK + AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Name the APK + AAB with the app version
        id: name
        run: |
          VER=$(node -p "require('./metadata.json').APP_VERSION")
          TAG="${{ github.event.release.tag_name }}"
          SUFFIX="${TAG:-$VER}"
          APK_OUT="BetterTroveTools-${SUFFIX}.apk"
          AAB_OUT="BetterTroveTools-${SUFFIX}.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_OUT"
          cp android/app/build/outputs/bundle/release/app-release.aab "$AAB_OUT"
          echo "apk=$APK_OUT" >> "$GITHUB_OUTPUT"
          echo "aab=$AAB_OUT" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetterTroveTools-release-apk
          path: ${{ steps.name.outputs.apk }}
          if-no-files-found: error

      # AAB is for Play Store upload only — never attach to the public GitHub
      # release, since end users can't install .aab files directly. The
      # maintainer downloads it from this workflow run and uploads it to Play.
      - name: Upload AAB artifact (for Play Store upload)
        uses: actions/upload-artifact@v4
        with:
          name: BetterTroveTools-release-aab
          path: ${{ steps.name.outputs.aab }}
          if-no-files-found: error

      - name: Attach APK to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.name.outputs.apk }}
