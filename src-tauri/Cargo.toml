[package]
name = "better-trove-tools"
version = "2026.10.6"
description = "Better Trove Tools"
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "BetterTroveTools"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
btt-core = { path = "../core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
