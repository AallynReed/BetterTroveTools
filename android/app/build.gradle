apply plugin: 'com.android.application'

// Keep the Android version in lockstep with the app's metadata.json (APP_VERSION),
// the same source the desktop build reads. versionName mirrors it verbatim
// (e.g. "2026.06.02") and versionCode is its digits (e.g. 20260602), which stays
// monotonically increasing for date-based versions.
def appVersionName = "2026.06.02"
def appVersionCode = 20260602
try {
    def meta = new groovy.json.JsonSlurper().parseText(file("${rootProject.projectDir}/../metadata.json").text)
    appVersionName = meta.APP_VERSION
    appVersionCode = (appVersionName.replaceAll('[^0-9]', '')) as Integer
} catch (Exception e) {
    logger.warn("BTT: could not read APP_VERSION from metadata.json (${e.message}); using ${appVersionName}")
}

// Release signing configuration. Values come from one of two sources, in order:
//   1. Environment variables (CI: ANDROID_KEYSTORE_PATH/PASSWORD/KEY_ALIAS/KEY_PASSWORD)
//   2. ~/.android/btt-release/keystore.properties (local dev — outside the repo,
//      so no keystore data lives in version control)
// If neither is available the release variant builds UNSIGNED — caller (CI or
// developer) will get a clear "no signing config" error rather than silently
// shipping an unusable APK.
def releaseSigningProps = new Properties()
def releaseSigningPropsFile = new File(System.getProperty('user.home'), '.android/btt-release/keystore.properties')
if (releaseSigningPropsFile.exists()) {
    releaseSigningPropsFile.withInputStream { releaseSigningProps.load(it) }
}
def releaseStoreFile = System.getenv('ANDROID_KEYSTORE_PATH') ?: releaseSigningProps.getProperty('storeFile')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: releaseSigningProps.getProperty('storePassword')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS') ?: releaseSigningProps.getProperty('keyAlias')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD') ?: releaseSigningProps.getProperty('keyPassword')
def releaseSigningReady = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace "net.aallyn.btt"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "net.aallyn.btt"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (releaseSigningReady) {
        signingConfigs {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    } else {
        logger.warn("BTT: no release signing config found — release APK will be unsigned. " +
                    "Set env vars (ANDROID_KEYSTORE_PATH/PASSWORD/KEY_ALIAS/KEY_PASSWORD) or " +
                    "create ~/.android/btt-release/keystore.properties to sign release builds.")
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
