[workspace]
members = ["core", "src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Aallyn Reed"]

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
