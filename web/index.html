<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Better Trove Tools</title>
    
    <link rel="stylesheet" href="css/style.css">
    
    <script type="text/javascript" src="/eel.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <div id="external-request-indicator" style="position: fixed; top: 15px; right: 20px; z-index: 10001; display: block; color: var(--text-main, #fff); background: var(--bg-panel, #1d232b); border: 1px solid var(--border-color, #444c5e); padding: 8px 12px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.7); cursor: pointer;" data-tooltip="No external requests made yet.">
        <i class="fa-solid fa-wifi"></i>
    </div>

    <nav id="sidebar">
        <div class="sidebar-header">
            <button id="burger-btn">
                <i class="fa-solid fa-bars"></i>
            </button>
            <h3 id="app-title">Better Trove Tools</h3>
        </div>
        <ul class="menu">
            <li>
                <button class="nav-btn" data-target="home">
                    <i class="fa-solid fa-house nav-icon"></i>
                    <span class="nav-text" data-i18n>Home</span>
                </button>
            </li>
            <li>
                <button class="nav-btn" data-target="trovesaurus">
                    <img src="https://trovesaurus.com/images/logos/Sage_64.png" alt="Trovesaurus" class="nav-icon" style="width: 24px; height: 24px; object-fit: contain;">
                    <span class="nav-text" data-i18n>Trovesaurus</span>
                </button>
            </li>
            <li>
                <button class="nav-btn" data-target="mod_manager">
                    <i class="fa-solid fa-cubes nav-icon"></i>
                    <span class="nav-text" data-i18n>Mod Manager</span>
                </button>
            </li>
            <li>
                <button class="nav-btn" data-target="file_manager">
                    <i class="fa-solid fa-folder-tree nav-icon"></i>
                    <span class="nav-text" data-i18n>Game File Manager</span>
                </button>
            </li>
            <li>
                <button class="nav-btn" data-target="modder_tools">
                    <i class="fa-solid fa-toolbox nav-icon"></i>
                    <span class="nav-text" data-i18n>Modder Tools</span>
                </button>
            </li>
            <li>
                <button class="nav-btn" data-target="star_chart">
                    <i class="fa-solid fa-star nav-icon"></i>
                    <span class="nav-text" data-i18n>Star Chart</span>
                </button>
            </li>
            <li>
                <button class="nav-btn" data-target="gem_builds">
                    <i class="fa-solid fa-dice-five nav-icon"></i>
                    <span class="nav-text" data-i18n>Gem Builds</span>
                </button>
            </li>
            <li>
                <button class="nav-btn" data-target="gem_simulator">
                    <i class="fa-solid fa-gem nav-icon"></i>
                    <span class="nav-text" data-i18n>Gem Simulator</span>
                </button>
            </li>
            <li>
                <button class="nav-btn" data-target="calculators">
                    <i class="fa-solid fa-calculator nav-icon"></i>
                    <span class="nav-text" data-i18n>Calculators</span>
                </button>
            </li>
            <li>
                <button class="nav-btn" data-target="allies">
                    <i class="fa-solid fa-paw nav-icon"></i>
                    <span class="nav-text" data-i18n>Ally Codex</span>
                </button>
            </li>
        </ul>

        <ul class="menu" style="margin-top: auto; margin-bottom: 15px;">
            <li>
                <button class="nav-btn" data-target="settings">
                    <i class="fa-solid fa-gear nav-icon"></i>
                    <span class="nav-text" data-i18n>Settings</span>
                </button>
            </li>
            <li>
                <button class="nav-btn" data-target="about">
                    <i class="fa-solid fa-circle-info nav-icon"></i>
                    <span class="nav-text" data-i18n>About</span>
                </button>
            </li>
        </ul>
        
        <div class="sidebar-lang-container">
            <i class="fa-solid fa-globe nav-icon" data-i18n-title="Language"></i>
            <span class="nav-text lang-select-wrapper" style="width: 100%;">
                <select id="global-language-select" class="custom-dropdown" style="width: 100%;">
                </select>
            </span>
        </div>

        <div id="server-time-wrapper">
            <div id="server-time-label" data-i18n>Server Time</div>
            <div id="server-time-date">--</div>
            <div id="server-time-clock">--:--:--</div>
        </div>

    </nav>

    <main id="view-container">
        <h1 style="padding: 40px; color: #666;" data-i18n>Select a tool from the menu.</h1>
    </main>

    <div id="request-log-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 10005; align-items: center; justify-content: center;">
        <div style="background: var(--bg-panel, #1d232b); border: 1px solid var(--border-color, #444c5e); border-radius: 8px; width: 80%; max-width: 800px; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.7);">
            <div style="padding: 15px 20px; border-bottom: 1px solid var(--border-color, #444c5e); display: flex; justify-content: space-between; align-items: center;">
                <h2 style="margin: 0; color: var(--text-main, #fff); font-size: 1.2em;"><i class="fa-solid fa-list"></i> <span data-i18n>External Request Log</span></h2>
                <div>
                    <button id="copy-request-log-btn" style="background: transparent; border: none; color: var(--text-muted, #a3adc2); cursor: pointer; font-size: 1.2em; margin-right: 15px;" title="Copy entire log"><i class="fa-regular fa-copy"></i></button>
                    <button id="close-request-log-btn" style="background: transparent; border: none; color: var(--text-muted, #a3adc2); cursor: pointer; font-size: 1.2em;"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
            <div id="request-log-content" style="padding: 20px; overflow-y: auto; flex: 1; color: var(--text-muted, #a3adc2); font-family: monospace; font-size: 0.9em;">
            </div>
        </div>
    </div>

    <div id="server-time-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 10005; align-items: center; justify-content: center; backdrop-filter: blur(4px);">
        <div style="background: var(--bg-panel, #1d232b); border: 1px solid var(--border-color, #444c5e); border-radius: 8px; width: 90%; max-width: 600px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: fadeIn 0.2s ease-out;">
            <div style="padding: 15px 20px; border-bottom: 1px solid var(--border-color, #444c5e); display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); border-radius: 8px 8px 0 0;">
                <h2 style="margin: 0; color: #fff; font-size: 1.2em;"><i class="fa-solid fa-globe" style="color: var(--accent-blue);"></i> <span data-i18n>Global Times</span></h2>
                <button id="close-server-time-btn" style="background: transparent; border: none; color: var(--text-muted, #a3adc2); cursor: pointer; font-size: 1.2em; transition: color 0.2s;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="server-time-modal-content" style="padding: 20px; display: flex; flex-direction: column;">
                <div id="st-timezones-list" style="display: flex; flex-direction: column; gap: 10px; max-height: 40vh; overflow-y: auto; padding-right: 5px;"></div>
                
                <hr style="border: 0; border-top: 1px dashed var(--border-color, #444c5e); margin: 15px 0 10px 0;">
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3 style="margin: 0; color: var(--accent-blue, #5ec6ff); font-size: 1.1em;"><i class="fa-solid fa-clock-rotate-left"></i> <span data-i18n>Time Converter</span></h3>
                </div>
                
                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <input type="datetime-local" id="st-converter-input" style="flex: 1; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color, #444c5e); color: #fff; padding: 8px; border-radius: 4px; font-family: inherit; outline: none;">
                    <select id="st-converter-tz" class="custom-dropdown" style="width: 100%; max-width: 250px;"></select>
                </div>
                
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.05);">
                    <div>
                        <div style="font-size: 0.8em; color: var(--text-muted, #a3adc2);" data-i18n>Trove Time</div>
                        <div id="st-converter-result" style="font-weight: bold; color: #fff; font-size: 1.1em;">--</div>
                    </div>
                    <div style="display: flex; gap: 5px; align-items: center;">
                        <select id="st-discord-format" class="custom-dropdown" style="width: 100%; max-width: 350px;">
                            <option value="t">Short Time (16:20)</option>
                            <option value="T">Long Time (16:20:30)</option>
                            <option value="d">Short Date (20/04/2021)</option>
                            <option value="D">Long Date (20 April 2021)</option>
                            <option value="f" selected>Short D/T (20 Apr 2021 16:20)</option>
                            <option value="F">Long D/T (Tue, 20 Apr 2021 16:20)</option>
                            <option value="R">Relative (in 2 months)</option>
                        </select>
                        <button id="st-btn-copy-discord" class="primary-btn" style="padding: 6px 12px; font-size: 0.85em;" data-i18n-title="Copy Discord Timestamp"><i class="fa-brands fa-discord"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="command-palette-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100000; backdrop-filter: blur(4px); align-items: flex-start; justify-content: center; padding-top: 12vh;">
        <div id="command-palette" style="background: var(--bg-panel, #1d232b); border: 1px solid var(--accent-blue, #5ec6ff); width: 90%; max-width: 600px; border-radius: 8px; box-shadow: 0 15px 50px rgba(0,0,0,0.7); overflow: hidden; display: flex; flex-direction: column;">
            <div style="display: flex; align-items: center; padding: 15px; border-bottom: 1px solid var(--border-color, #444c5e);">
                <i class="fa-solid fa-magnifying-glass" style="color: var(--accent-blue, #5ec6ff); margin-right: 15px; font-size: 1.2em;"></i>
                <input type="text" id="cmd-input" placeholder="Search commands or jump to tool..." style="flex: 1; background: transparent; border: none; color: #fff; font-size: 1.1em; outline: none;">
                <div style="font-size: 0.7em; color: var(--text-muted, #a3adc2); background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 4px; font-weight: bold;">ESC</div>
            </div>
            <div id="cmd-results" style="max-height: 400px; overflow-y: auto; padding: 10px 0;"></div>
        </div>
    </div>
    
    <div id="custom-context-menu" class="context-menu" style="display: none;"></div>

    <script src="js/i18n.js"></script>
    <script src="js/main.js"></script>
    <script src="js/home.js"></script>
    <script src="js/mod_manager.js"></script>
    <script src="js/file_manager.js"></script>
    <script src="js/trovesaurus.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/modder_tools.js"></script>
    <script src="js/star_chart.js"></script>
    <script src="js/gem_simulator.js"></script>
    <script src="js/calculators.js"></script>
    <script src="js/allies.js"></script>
    <script src="js/gem_builds.js"></script>
    <script src="js/about.js"></script>
</body>
</html>
