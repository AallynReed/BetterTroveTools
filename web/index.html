<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trove Tool</title>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mod_manager.css">
    <link rel="stylesheet" href="css/file_manager.css">
    <link rel="stylesheet" href="css/trovesaurus.css">
    
    <script type="text/javascript" src="/eel.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>

    <nav id="sidebar">
        <div class="sidebar-header">
            <button id="burger-btn">
                <i class="fa-solid fa-bars"></i>
            </button>
            <h2 id="app-title">Trove Tool</h2>
        </div>
        <ul class="menu">
            <li>
                <button class="nav-btn" data-target="trovesaurus">
                    <img src="https://trovesaurus.com/images/logos/Sage_64.png" alt="Trovesaurus" class="nav-icon" style="width: 24px; height: 24px; object-fit: contain;">
                    <span class="nav-text">Trovesaurus</span>
                </button>
            </li>
            <li>
                <button class="nav-btn" data-target="mod_manager">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                    <span class="nav-text">Mod Manager</span>
                </button>
            </li>
            <li>
                <button class="nav-btn" data-target="file_manager">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    </svg>
                    <span class="nav-text">Game File Manager</span>
                </button>
            </li>
        </ul>
    </nav>

    <main id="view-container">
        <h1 style="padding: 40px; color: #666;">Select a tool from the menu.</h1>
    </main>

    <script src="js/main.js"></script>
    <script src="js/mod_manager.js"></script>
    <script src="js/file_manager.js"></script>
    <script src="js/trovesaurus.js"></script>
</body>
</html>
