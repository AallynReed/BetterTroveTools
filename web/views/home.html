<head>
    <link rel="stylesheet" href="css/home.css">
</head>
<div class="home-container">
    <div class="home-header">
        <h1>Welcome to Better Trove Tools</h1>
    </div>

    <div class="section-header">
        <h2><i class="fa-brands fa-twitch" style="color: #9146FF;"></i> Live on Twitch</h2>
    </div>
    
    <div id="streams-loading" class="loading-box">
        <i class="fa-solid fa-spinner fa-spin"></i> Fetching Live Streams...
    </div>
    
    <div class="carousel-wrapper" id="carousel-wrapper" style="display: none;">
        <button id="btn-scroll-left" class="carousel-btn left"><i class="fa-solid fa-chevron-left"></i></button>
        <div class="streams-carousel" id="streams-carousel"></div>
        <button id="btn-scroll-right" class="carousel-btn right"><i class="fa-solid fa-chevron-right"></i></button>
    </div>

    <div class="split-layout">
        
        <!-- LEFT COLUMN: Buffs & Events -->
        <div class="split-column">
            
            <!-- Buffs Section -->
            <div class="section-header" style="margin-top: 40px;">
                <h2><i class="fa-solid fa-bolt" style="color: #fbc02d;"></i> Server Buffs</h2>
            </div>
            <div id="buffs-loading" class="loading-box">
                <i class="fa-solid fa-spinner fa-spin"></i> Fetching Server Data...
            </div>
            <div class="buffs-grid" id="buffs-grid" style="display: none;"></div>

            <!-- Events Section -->
            <div class="section-header" style="margin-top: 40px;">
                <h2><i class="fa-solid fa-calendar-days" style="color: #5ec6ff;"></i> Events</h2>
            </div>
            <div id="events-loading" class="loading-box">
                <i class="fa-solid fa-spinner fa-spin"></i> Loading Trovesaurus Calendar...
            </div>
            <div id="events-list" class="events-list" style="display: none;"></div>

        </div>

        <!-- RIGHT COLUMN: Rotations -->
        <div class="split-column">
            <div class="section-header" style="margin-top: 40px;">
                <h2><i class="fa-solid fa-rotate" style="color: #4caf50;"></i> Rotations</h2>
            </div>
            <div id="merchants-grid" class="merchants-grid" style="display: none;"></div>
        </div>

    </div>
</div>

<!-- D15 Future Rotations Modal -->
<div id="d15-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fa-solid fa-leaf" style="color: #4caf50;"></i> Upcoming D15 Biomes</h3>
            <button class="modal-close" id="modal-close-btn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body" id="d15-modal-body">
            <!-- Rendered via JS -->
        </div>
    </div>
</div>
