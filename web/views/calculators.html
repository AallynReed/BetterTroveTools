<head>
    <link rel="stylesheet" href="css/calculators.css">
</head>
<div class="calculators-container">
    <div class="page-header">
        <h1><i class="fa-solid fa-calculator" style="color: #5ec6ff;"></i> <span data-i18n>Calculators</span></h1>
        <div class="subtitle" data-i18n>Optimize your Power Rank, Mastery, and Magic Find.</div>
    </div>

    <div class="tabs-wrapper">
        <div class="tab-buttons">
            <button class="tab-btn active" data-tab="pr-tab">
                <i class="fa-solid fa-star" style="color: #fbc02d;"></i> <span data-i18n>Power Rank</span>
            </button>
            <button class="tab-btn" data-tab="mastery-tab">
                <i class="fa-solid fa-crown" style="color: #ff9800;"></i> <span data-i18n>Mastery</span>
            </button>
            <button class="tab-btn" data-tab="mf-tab">
                <i class="fa-solid fa-gem" style="color: #5ec6ff;"></i> <span data-i18n>Magic Find</span>
            </button>
        </div>

        <div class="tab-content active" id="pr-tab">
            <div class="mf-header" style="border-color: #fbc02d;">
                <div class="mf-total-box">
                    <span class="mf-total-label" data-i18n>Total Power Rank</span>
                    <span class="mf-total-value" id="pr-total-display" style="color: #fbc02d; text-shadow: 0 0 20px rgba(251, 192, 45, 0.4);">0</span>
                </div>
            </div>
            <div class="mf-calculator-grid" id="pr-inputs-container"></div>
        </div>

        <div class="tab-content" id="mastery-tab">
            <div class="mf-header" style="border-color: #ff9800;">
                <div class="mf-total-box">
                    <span class="mf-total-label" data-i18n>Total Mastery Power Rank</span>
                    <span class="mf-total-value" id="mastery-pr-display" style="color: #ff9800; text-shadow: 0 0 20px rgba(255, 152, 0, 0.4);">0</span>
                </div>
                
                <div class="mastery-stats-grid">
                    <div class="mastery-stat-box">
                        <span class="stat-val" id="mastery-dmg">+0%</span>
                        <span class="stat-label"><i class="fa-solid fa-burst"></i> <span data-i18n>Damage</span></span>
                    </div>
                    <div class="mastery-stat-box">
                        <span class="stat-val" id="mastery-hp">+0%</span>
                        <span class="stat-label"><i class="fa-solid fa-heart"></i> <span data-i18n>Health</span></span>
                    </div>
                    <div class="mastery-stat-box">
                        <span class="stat-val" id="mastery-light" style="color: #00bcd4;">+0</span>
                        <span class="stat-label"><i class="fa-solid fa-sun"></i> <span data-i18n>Light</span></span>
                    </div>
                    <div class="mastery-stat-box">
                        <span class="stat-val" id="mastery-mf">+0</span>
                        <span class="stat-label"><i class="fa-solid fa-gem"></i> <span data-i18n>Magic Find</span></span>
                    </div>
                </div>
            </div>

            <div class="mf-calculator-grid">
                <div class="calc-item" style="border-left: 4px solid #fbc02d;">
                    <div class="calc-item-header">
                        <span><i class="fa-solid fa-crown" style="color: #fbc02d;"></i> <span data-i18n>Trove Mastery</span></span>
                        <span class="calc-item-badge" style="background: rgba(251, 192, 45, 0.1); color: #fbc02d;" data-i18n>Soft Cap: 1000</span>
                    </div>
                    <div class="calc-slider-wrapper">
                        <input type="range" class="calc-slider mastery-input" id="trove-slider" min="0" max="1100" value="899" style="accent-color: #fbc02d;">
                        <input type="number" class="calc-number-input mastery-input-sync" id="trove-number" min="0" max="2000" value="899">
                    </div>
                </div>

                <div class="calc-item" style="border-left: 4px solid #00bcd4;">
                    <div class="calc-item-header">
                        <span><i class="fa-solid fa-gem" style="color: #00bcd4;"></i> <span data-i18n>Geode Mastery</span></span>
                        <span class="calc-item-badge" style="background: rgba(0, 188, 212, 0.1); color: #00bcd4;" data-i18n>Soft Cap: 100</span>
                    </div>
                    <div class="calc-slider-wrapper">
                        <input type="range" class="calc-slider mastery-input" id="geode-slider" min="0" max="150" value="100" style="accent-color: #00bcd4;">
                        <input type="number" class="calc-number-input mastery-input-sync" id="geode-number" min="0" max="200" value="100">
                    </div>
                </div>
            </div>
        </div>

        <div class="tab-content" id="mf-tab">
            <div class="mf-header">
                <div class="mf-total-box">
                    <span class="mf-total-label" data-i18n>Total Magic Find</span>
                    <span class="mf-total-value" id="mf-total-display">0</span>
                </div>
                <div class="mf-breakdown" id="mf-breakdown-display">
                    Base MF: 0 | Bonus Multiplier: 0%
                </div>
            </div>
            <div class="mf-calculator-grid" id="mf-inputs-container"></div>
        </div>
    </div>
</div>
