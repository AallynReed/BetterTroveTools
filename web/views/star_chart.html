<head>
    <link rel="stylesheet" href="css/star_chart.css">
</head>
<div class="star-chart-container">
    <div class="star-chart-header">
        <h1>Star Chart</h1>
        <p class="file-meta">Interactive Constellation Map</p>
    </div>
    
    <div class="chart-layout">
        <!-- The visual map -->
        <div id="chart-wrapper" class="placeholder-box">
            <h3><i class="fa-solid fa-spinner fa-spin"></i> Calculating Constellations...</h3>
        </div>

        <!-- The stats side panel -->
        <div id="build-summary-panel">
            <h3>Current Build</h3>
            
            <div class="build-share-controls">
                <input type="text" id="build-code-input" placeholder="Paste build code here..." autocomplete="off" spellcheck="false" />
                <div class="build-buttons">
                    <button id="btn-load-code" class="secondary-btn" title="Load Build from Code"><i class="fa-solid fa-download"></i></button>
                    <button id="btn-copy-code" class="secondary-btn" title="Copy Build Code"><i class="fa-regular fa-copy"></i></button>
                </div>
            </div>
            
            <div id="summary-content">
                <p class="file-meta">Select nodes to calculate stats.</p>
            </div>
        </div>
    </div>
    
    <div id="star-tooltip"></div>
</div>
