<div id="manage-modpacks-app" class="manage-panel" v-cloak>
    <!-- ===================== LIST ===================== -->
    <template v-if="view === 'list'">
        <div class="manage-header">
            <div>
                <h3>{{ t('manage.modpacks_title') }}</h3>
                <p class="help-text">{{ t('manage.modpacks_help') }}</p>
            </div>
            <div class="manage-header-actions">
                <button class="secondary-btn" @click="load" :disabled="loading"><i class="fa-solid fa-rotate-right" :class="{ 'fa-spin': loading }"></i> <span>{{ t('manage.refresh') }}</span></button>
                <button class="primary-btn" @click="createForm.open = !createForm.open"><i class="fa-solid fa-plus"></i> <span>{{ t('manage.new_modpack') }}</span></button>
            </div>
        </div>

        <div v-if="createForm.open" class="manage-create">
            <input type="text" v-model="createForm.title" :placeholder="t('manage.title_placeholder')" maxlength="120" @keyup.enter="createPack">
            <select v-model="createForm.visibility">
                <option value="draft">{{ t('manage.vis_draft') }}</option>
                <option value="unlisted">{{ t('manage.vis_unlisted') }}</option>
                <option value="public">{{ t('manage.vis_public') }}</option>
            </select>
            <button class="primary-btn" @click="createPack" :disabled="busy || !createForm.title.trim()"><i class="fa-solid fa-check"></i> <span>{{ t('manage.create') }}</span></button>
        </div>

        <div v-if="loading" class="manage-state"><i class="fa-solid fa-spinner fa-spin"></i> {{ t('manage.loading') }}</div>
        <div v-else-if="error" class="manage-state manage-error"><i class="fa-solid fa-triangle-exclamation"></i> {{ error }}</div>
        <div v-else-if="!items.length" class="manage-state">{{ t('manage.no_modpacks') }}</div>

        <div v-else class="manage-list">
            <div v-for="m in items" :key="m.handle + '/' + m.slug" class="manage-card" @click="openEditor(m)">
                <div class="manage-thumb">
                    <img v-if="bannerUrl(m)" :src="bannerUrl(m)" alt="" loading="lazy">
                    <i v-else class="fa-solid fa-layer-group"></i>
                </div>
                <div class="manage-card-body">
                    <div class="manage-card-top">
                        <span class="manage-card-title">{{ m.title }}</span>
                        <span class="manage-badge" :class="'vis-' + m.visibility">{{ t('manage.vis_' + m.visibility) }}</span>
                        <span v-if="m.is_collaborator" class="manage-badge collab">{{ t('manage.collaborator') }}</span>
                    </div>
                    <div class="manage-card-summary">{{ m.summary || t('manage.no_summary') }}</div>
                    <div class="manage-card-stats">
                        <span><i class="fa-solid fa-cubes"></i> {{ t('manage.mods_count').replace('{n}', m.mod_count || 0) }}</span>
                        <span><i class="fa-solid fa-code-branch"></i> {{ t('manage.variants_count').replace('{n}', m.variant_count || 0) }}</span>
                        <span><i class="fa-solid fa-download"></i> {{ m.download_count || 0 }}</span>
                    </div>
                </div>
                <div class="manage-card-actions" @click.stop>
                    <button class="primary-btn" @click="openEditor(m)"><i class="fa-solid fa-sliders"></i> <span>{{ t('manage.manage') }}</span></button>
                    <button class="icon-btn" @click="openStudio(m)" :title="t('manage.open_studio')"><i class="fa-solid fa-up-right-from-square"></i></button>
                    <button class="icon-btn danger" @click="removePack(m)" :title="t('manage.delete')"><i class="fa-solid fa-trash"></i></button>
                </div>
            </div>
        </div>
    </template>

    <!-- ===================== EDITOR ===================== -->
    <template v-else>
        <div class="manage-editor-bar">
            <button class="secondary-btn" @click="closeEditor"><i class="fa-solid fa-arrow-left"></i> <span>{{ t('manage.back') }}</span></button>
            <h3 class="manage-editor-title">{{ detail.title || editTarget.title }}</h3>
            <button class="secondary-btn" @click="openStudio(editTarget)"><i class="fa-solid fa-up-right-from-square"></i> <span>{{ t('manage.open_studio') }}</span></button>
        </div>

        <div v-if="detailLoading" class="manage-state"><i class="fa-solid fa-spinner fa-spin"></i> {{ t('manage.loading') }}</div>
        <div v-else-if="detailError" class="manage-state manage-error"><i class="fa-solid fa-triangle-exclamation"></i> {{ detailError }}</div>

        <template v-else>
            <!-- Details -->
            <section class="manage-section">
                <h4>{{ t('manage.sec_details') }}</h4>
                <label>{{ t('manage.field_title') }}</label>
                <input type="text" v-model="form.title" maxlength="120">
                <label>{{ t('manage.field_summary') }}</label>
                <input type="text" v-model="form.summary" maxlength="280">
                <label>{{ t('manage.field_description') }}</label>
                <textarea v-model="form.description" rows="5" :placeholder="t('manage.markdown_ok')"></textarea>
                <div class="manage-row">
                    <div><label>{{ t('manage.field_tags') }}</label><input type="text" v-model="form.tags" :placeholder="t('manage.tags_placeholder')"></div>
                    <div>
                        <label>{{ t('manage.field_visibility') }}</label>
                        <select v-model="form.visibility">
                            <option value="draft">{{ t('manage.vis_draft') }}</option>
                            <option value="unlisted">{{ t('manage.vis_unlisted') }}</option>
                            <option value="public">{{ t('manage.vis_public') }}</option>
                        </select>
                    </div>
                </div>
                <div class="manage-row">
                    <div><label>{{ t('manage.field_discord') }}</label><input type="text" v-model="form.discord_url" placeholder="https://discord.gg/…"></div>
                    <div><label>{{ t('manage.field_website') }}</label><input type="text" v-model="form.website_url" placeholder="https://…"></div>
                </div>
                <label>{{ t('manage.field_donations') }}</label>
                <textarea v-model="form.donation_urls" rows="2" :placeholder="t('manage.one_url_per_line')"></textarea>
                <div class="manage-section-actions">
                    <button class="primary-btn" @click="saveDetails" :disabled="savingDetails || !form.title.trim()">
                        <i v-if="savingDetails" class="fa-solid fa-spinner fa-spin"></i> <span>{{ t('manage.save_details') }}</span>
                    </button>
                </div>
            </section>

            <!-- Banner -->
            <section class="manage-section">
                <h4>{{ t('manage.sec_banner') }}</h4>
                <div class="manage-banner-row">
                    <div class="manage-banner-preview">
                        <img v-if="detail.banner_sha" :src="imageUrl(detail.banner_sha)" alt="">
                        <span v-else class="manage-muted">{{ t('manage.no_banner') }}</span>
                    </div>
                    <button class="secondary-btn" @click="uploadBanner" :disabled="bannerBusy"><i class="fa-solid fa-image"></i> <span>{{ t('manage.upload_banner') }}</span></button>
                </div>
            </section>

            <!-- Variants + mod list -->
            <section class="manage-section">
                <h4>{{ t('manage.sec_variants') }}</h4>
                <div class="manage-variant-bar">
                    <select v-model="selectedVariant" @change="syncWorking">
                        <option v-for="v in (detail.variants || [])" :key="v.name" :value="v.name">{{ v.label || v.name }}{{ v.name === detail.default_variant ? ' ★' : '' }}</option>
                    </select>
                    <button class="icon-btn" @click="setDefaultVariant" :title="t('manage.set_default')" :disabled="selectedVariant === detail.default_variant"><i class="fa-solid fa-star"></i></button>
                    <button class="icon-btn" @click="renameVariant" :title="t('manage.rename')"><i class="fa-solid fa-pen"></i></button>
                    <button class="icon-btn" @click="newVariant" :title="t('manage.new_variant')"><i class="fa-solid fa-plus"></i></button>
                    <button class="icon-btn danger" @click="deleteVariant" :title="t('manage.delete')" :disabled="(detail.variants || []).length <= 1"><i class="fa-solid fa-trash"></i></button>
                </div>
                <div v-if="variantEdit.open" class="manage-collab-add">
                    <input type="text" v-model="variantEdit.value" :placeholder="variantEdit.mode === 'new' ? t('manage.variant_name') : t('manage.variant_label')" @keyup.enter="confirmVariantEdit">
                    <button class="primary-btn" @click="confirmVariantEdit" :disabled="!variantEdit.value.trim()"><i class="fa-solid fa-check"></i> <span>{{ t('manage.save') }}</span></button>
                    <button class="secondary-btn" @click="variantEdit.open = false">{{ t('common.cancel') }}</button>
                </div>

                <div v-if="!workingEntries.length" class="manage-muted">{{ t('manage.empty_variant') }}</div>
                <div v-else class="manage-entry-list">
                    <div v-for="(e, i) in workingEntries" :key="i" class="manage-entry" :class="{ unavailable: e.available === false }">
                        <div class="manage-entry-main">
                            <span class="manage-entry-title">{{ e.title || (e.handle + '/' + e.slug) }}</span>
                            <span v-if="e.custom" class="manage-badge mode">{{ t('manage.uploaded') }}</span>
                            <span v-if="e.available === false" class="manage-badge vis-unlisted">{{ t('manage.unavailable') }}</span>
                            <span class="manage-muted" v-if="!e.custom">{{ e.author }}</span>
                        </div>
                        <div class="manage-entry-controls" v-if="!e.custom">
                            <label class="manage-lock"><input type="checkbox" v-model="e.version_locked"> {{ t('manage.lock') }}</label>
                            <input v-if="e.version_locked" type="text" class="manage-lock-tag" v-model="e.locked_tag" :placeholder="e.version || t('manage.tag_placeholder')">
                        </div>
                        <div class="manage-entry-actions">
                            <button class="icon-btn" @click="moveEntry(i, -1)" :disabled="i === 0" :title="t('manage.move_up')"><i class="fa-solid fa-arrow-up"></i></button>
                            <button class="icon-btn" @click="moveEntry(i, 1)" :disabled="i === workingEntries.length - 1" :title="t('manage.move_down')"><i class="fa-solid fa-arrow-down"></i></button>
                            <button class="icon-btn danger" @click="removeEntry(i)" :title="t('manage.remove')"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>
                </div>

                <div class="manage-section-actions">
                    <button class="primary-btn" @click="saveEntries" :disabled="savingEntries">
                        <i v-if="savingEntries" class="fa-solid fa-spinner fa-spin"></i> <span>{{ t('manage.save_mod_list') }}</span>
                    </button>
                </div>

                <div class="manage-addmod">
                    <h4>{{ t('manage.add_mod') }}</h4>
                    <div class="manage-collab-add">
                        <input type="text" v-model="searchQuery" :placeholder="t('mods_hub.search_placeholder')" @keyup.enter="searchMods">
                        <button class="secondary-btn" @click="searchMods" :disabled="searching"><i class="fa-solid fa-magnifying-glass"></i> <span>{{ t('manage.search') }}</span></button>
                    </div>
                    <div v-if="searchResults.length" class="manage-search-results">
                        <div v-for="r in searchResults" :key="r.handle + '/' + r.slug" class="manage-search-row">
                            <span class="manage-entry-title">{{ r.title }}</span>
                            <span class="manage-muted">{{ r.author || r.owner_username }}</span>
                            <button class="icon-btn" @click="addEntry(r)" :disabled="hasEntry(r)" :title="t('manage.add')"><i class="fa-solid fa-plus"></i></button>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Collaborators -->
            <section class="manage-section">
                <h4>{{ t('manage.sec_collaborators') }}</h4>
                <div v-if="!(detail.collaborators || []).length" class="manage-muted">{{ t('manage.no_collaborators') }}</div>
                <div v-else class="manage-collab-list">
                    <div v-for="c in detail.collaborators" :key="c.id" class="manage-collab">
                        <span><i class="fa-solid fa-user"></i> {{ c.username }}</span>
                        <button v-if="detail.is_primary_owner" class="icon-btn danger" @click="removeCollaborator(c)" :title="t('manage.remove')"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>
                <div v-if="detail.is_primary_owner" class="manage-collab-add">
                    <input type="text" v-model="collabName" :placeholder="t('manage.collab_username')" @keyup.enter="addCollaborator">
                    <button class="secondary-btn" @click="addCollaborator" :disabled="collabBusy || !collabName.trim()"><i class="fa-solid fa-user-plus"></i> <span>{{ t('manage.add') }}</span></button>
                </div>
            </section>
        </template>
    </template>
</div>
