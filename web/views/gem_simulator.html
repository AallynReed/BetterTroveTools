<head>
    <link rel="stylesheet" href="css/gem_simulator.css">
</head>
<div class="gem-sim-container">
    <div class="gem-sim-column left-column">
        <div class="column-header">Equipped Gems & Stats</div>
        <div class="column-scroll-area">
            <div id="equipped"></div>
        </div>
    </div>
    
    <div class="gem-sim-column center-column">
        <div class="column-header">Gem Forge</div>
        <div class="column-scroll-area">
            <div class="gem-form" id="gem-creator-panel">
                <div class="gem-form-row">
                    <label>Type<select id="gem-type"></select></label>
                    <label>Tier<select id="gem-tier"></select></label>
                </div>
                <div class="gem-form-row">
                    <label>Element<select id="gem-element"></select></label>
                    <label id="gem-restriction-label">Restriction<select id="gem-restriction"></select></label>
                </div>
                <div class="gem-form-row" style="display: flex; gap: 15px; margin-bottom: 10px;">
                    <label style="flex:1;">
                        Level
                        <div style="display: flex; align-items: center; margin-top: 6px;">
                            <input type="range" id="gem-level-slider" min="1" max="35" value="1" style="flex:1;">
                            <span id="gem-level-value" style="width:30px;text-align:right;">1</span>
                        </div>
                    </label>
                    <div style="flex:1; display: flex; flex-direction: column; justify-content: flex-end;">
                        <label style="display:flex; align-items:center; margin-bottom: 6px; cursor: pointer; user-select: none;">
                            <input type="checkbox" id="gem-augment-null" checked style="margin-right:6px;">
                            <span style="font-size: 0.9em; color: var(--text-muted);">Random Augment</span>
                        </label>
                        <div style="display: flex; align-items: center;">
                            <input type="range" id="gem-augment-slider" min="0" max="100" value="0" style="flex:1;" disabled>
                            <span id="gem-augment-value" style="width:30px;text-align:right; color:var(--text-muted);">—</span>
                        </div>
                    </div>
                </div>
                <button id="btn-generate-gem" class="primary-btn" style="width: 100%; margin-top: 10px;">Generate Random Gem</button>
            </div>
            
            <hr class="panel-divider">
            
            <div id="selected">
                <div class="placeholder-text">Select a gem to view details</div>
            </div>
            
            <div id="trash-slot-container"></div>
        </div>
    </div>
    
    <div class="gem-sim-column right-column">
        <div class="column-header">Inventory</div>
        <div class="column-scroll-area">
            <div class="slots right-slots" id="inventory"></div>
        </div>
    </div>
</div>

<div id="custom-confirm-modal" class="modal-overlay">
    <div class="modal-content">
        <h3 id="modal-title">Delete Gem?</h3>
        <p id="modal-message">Are you sure you want to permanently delete this gem?</p>
        <div class="modal-actions">
            <button id="modal-cancel-btn" class="secondary-btn">Cancel</button>
            <button id="modal-confirm-btn" class="danger-btn">Delete</button>
        </div>
    </div>
</div>
