<head>
    <link rel="stylesheet" href="css/modder_tools/index.css">
    <link rel="stylesheet" href="css/modder_tools/file_manager.css">
</head>
<div id="modder-tools-vue-app" class="modder-tools-container" v-cloak>
    <div class="tabs-container">
        <div class="tab-buttons">
            <button v-if="!isWebMode" class="tab-btn" :class="{ active: activeTab === 'build' }" @click="setActiveTab('build')">
                <i class="fa-solid fa-hammer"></i> <span>{{ t('modder_tools.build_tmod') }}</span>
            </button>
            <button class="tab-btn" :class="{ active: activeTab === 'extract' }" @click="setActiveTab('extract')">
                <i class="fa-solid fa-box-open"></i> <span>{{ t('modder_tools.extract_tmod') }}</span>
            </button>
            <button v-if="!isWebMode" class="tab-btn" :class="{ active: activeTab === 'edit_tmod' }" @click="setActiveTab('edit_tmod')">
                <i class="fa-solid fa-pen-to-square"></i> <span>{{ t('modder_tools.edit_tmod') }}</span> <span class="beta-label">BETA</span>
            </button>
            <button v-if="!isWebMode" class="tab-btn" :class="{ active: activeTab === 'projects' }" @click="setActiveTab('projects')">
                <i class="fa-solid fa-diagram-project"></i> <span>{{ t('modder_tools.projects') }}</span>
            </button>
            <button v-if="!isWebMode" class="tab-btn" :class="{ active: activeTab === 'qb_editor' }" @click="setActiveTab('qb_editor')">
                <i class="fa-solid fa-cubes-stacked"></i> <span>{{ t('modder_tools.blueprint_editor') }}</span> <span class="beta-label">BETA</span>
            </button>
            <button v-if="!isWebMode" class="tab-btn" :class="{ active: activeTab === 'file_explorer' }" @click="setActiveTab('file_explorer')">
                <i class="fa-solid fa-folder-tree"></i> <span>{{ t('common.file_explorer') }}</span>
            </button>
            <button v-if="!isWebMode" class="tab-btn" :class="{ active: activeTab === 'update_tracker' }" @click="setActiveTab('update_tracker')">
                <i class="fa-solid fa-satellite-dish"></i> <span>{{ t('common.update_tracker') }}</span>
            </button>
            <button v-if="!isWebMode" class="tab-btn" :class="{ active: activeTab === 'software' }" @click="setActiveTab('software')">
                <i class="fa-solid fa-computer"></i> <span>{{ t('modder_tools.third_party_software') }}</span>
            </button>
        </div>

        <div class="tab-content" :class="{ active: activeTab === 'build' }">
            <div id="modder-build-vue-app-inner" v-cloak></div>
        </div>

        <div class="tab-content" :class="{ active: activeTab === 'extract' }">
            <div id="modder-extract-vue-app-inner" v-cloak></div>
        </div>

        <div class="tab-content" :class="{ active: activeTab === 'edit_tmod' }">
            <div id="modder-edit-tmod-vue-app-inner" v-cloak></div>
        </div>

        <div class="tab-content" :class="{ active: activeTab === 'projects' }">
            <div id="modder-projects-vue-app-inner" v-cloak></div>
        </div>

        <div class="tab-content" :class="{ active: activeTab === 'qb_editor' }">
            <div id="modder-qb-editor-vue-app-inner" v-cloak></div>
        </div>

        <div class="tab-content" :class="{ active: activeTab === 'file_explorer' || activeTab === 'update_tracker' }">
            <div id="modder-tools-file-manager-host"></div>
        </div>

        <div class="tab-content" :class="{ active: activeTab === 'software' }">
            <div id="modder-software-vue-app-inner" v-cloak></div>
        </div>
    </div>
</div>
