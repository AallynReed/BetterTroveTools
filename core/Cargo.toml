[package]
name = "btt-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Better Trove Tools backend: everything the frontend calls through eel"

[features]
default = ["home", "gems", "codexes", "modfile", "modder_tools", "mod_manager", "blueprint", "auth"]
home = []
gems = []
codexes = []
modfile = []
modder_tools = ["modfile"]
mod_manager = ["modfile", "modder_tools", "home"]
blueprint = ["codexes"]
auth = ["home"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
ureq = { version = "2", features = ["json", "gzip"] }
flate2 = "1"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
rayon = "1"
dirs = "5"
open = "5"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"
glob = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"
